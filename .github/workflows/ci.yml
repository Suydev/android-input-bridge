name: Android CI

on:
  push:
    branches: [ main, develop, "feature/**", "phase/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  # ── Build debug APKs ────────────────────────────────────────────────────────
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APKs
        run: ./gradlew :app-bridge:assembleDebug :app-receiver:assembleDebug --stacktrace --no-configuration-cache

      - name: Upload Bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: bridge-debug-apk-${{ github.run_number }}
          path: app-bridge/build/outputs/apk/debug/app-bridge-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk-${{ github.run_number }}
          path: app-receiver/build/outputs/apk/debug/app-receiver-debug.apk
          retention-days: 30
          if-no-files-found: error

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :shared-core:test :protocol:test --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  # ── Release APKs with GitHub Release (only on main) ────────────────────────
  release:
    name: Build Signed Release + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ build, test ]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.jks \
            -alias inputbridge \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass inputbridge123 \
            -keypass inputbridge123 \
            -dname "CN=InputBridge, O=InputBridge Open Source, C=US"

      - name: Build Release APKs
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          SIGNING_KEY_ALIAS: inputbridge
          SIGNING_KEY_PASSWORD: inputbridge123
          SIGNING_STORE_PASSWORD: inputbridge123
        run: ./gradlew :app-bridge:assembleRelease :app-receiver:assembleRelease --stacktrace --no-configuration-cache

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.run_number }}
          path: |
            app-bridge/build/outputs/apk/release/app-bridge-release.apk
            app-receiver/build/outputs/apk/release/app-receiver-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "InputBridge build-${{ github.run_number }}"
          body: |
            ## InputBridge build-${{ github.run_number }}

            ### Downloads
            - **app-bridge-release.apk** — Bridge app (phone with USB keyboard/mouse)
            - **app-receiver-release.apk** — Receiver app (tablet)

            ### Setup
            1. Install both APKs
            2. Enable accessibility service for both apps
            3. Set receiver IP in bridge app Settings
            4. Open MOUSE button in bridge app for trackpad
          files: |
            app-bridge/build/outputs/apk/release/app-bridge-release.apk
            app-receiver/build/outputs/apk/release/app-receiver-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
